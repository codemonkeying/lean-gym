name: live-smoke

# A deliberately LIGHT live run: drive ONE real seam (the apply_diff edit task) end to
# end against a single free hosted model, N=1, smoke rigor. This proves the live path
# still works - build_agent -> real lean_coder.Agent -> tool use -> scoring - without
# hammering any provider. It is NOT a certification (smoke never certifies).
#
# Manual or scheduled only - never triggered by pull_request, so an untrusted PR can
# never spend against the account or leak a key. Free Kilo models need no key; set the
# optional KILO_API_KEY repo secret only if you point it at a metered model.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC - once a week, one seam

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout leangym
        uses: actions/checkout@v4

      - name: Checkout leancoder
        uses: actions/checkout@v4
        with:
          repository: codemonkeying/lean-coder
          path: .leancoder

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt || true

      - name: One live seam (apply_diff, free model, N=1)
        env:
          LEANCODER_REPO: ${{ github.workspace }}/.leancoder
          EVAL_ALLOW_PAID: "1"                       # kilo is non-local, so the arm is required even for free models
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}  # optional: empty is fine for :free models
          LIVE_MODEL: nvidia/nemotron-3.5-lightning:free
        run: |
          python3 -m gym run \
            --provider kilo --model "$LIVE_MODEL" \
            --suite core --task edit_diff \
            --rigor smoke --n 1 --json
